name: Bug report
description: Report incorrect search, indexing, CLI, or API behavior.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the query or command and the observed result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sample documents and steps. Remove private content and paths.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, java --version, and MiniSearch version or commit.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: text
