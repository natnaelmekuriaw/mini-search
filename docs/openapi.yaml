openapi: 3.1.0
info:
  title: MiniSearch API
  version: 1.0.0
  description: Read-only search over a saved MiniSearch index.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/health:
    get:
      summary: Check whether the saved index is available
      responses:
        '200':
          description: The saved index is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/IndexUnavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/index:
    get:
      summary: Read index statistics
      responses:
        '200':
          description: Document and distinct term counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexStats'
        '503':
          $ref: '#/components/responses/IndexUnavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/search:
    get:
      summary: Search indexed documents
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4096
          description: Terms, phrases, AND, OR, exclusions, groups, and type or path filters.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Ranked matches and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/IndexUnavailable'
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    IndexStats:
      type: object
      required: [documents, terms]
      properties:
        documents:
          type: integer
          minimum: 0
        terms:
          type: integer
          minimum: 0
    SearchPage:
      type: object
      required: [total, offset, limit, results]
      properties:
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
    SearchResult:
      type: object
      required: [path, score, snippet]
      properties:
        path:
          type: string
        score:
          type: number
          minimum: 0
        snippet:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid query or request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IndexUnavailable:
      description: The saved index is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
